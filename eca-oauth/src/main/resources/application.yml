spring:
  application:
    name: eca-oauth
  ## Datasource properties
  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5433/eca_oauth
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        id:
          ## Use one hibernate_sequence for all entities
          db_structure_naming_strategy: legacy
        jdbc:
          lob:
            non_contextual_creation: true
  liquibase:
    contexts: schema,data
    change-log: classpath:db/liquibase-changelog.xml
  servlet:
    multipart:
      max-file-size: 10MB

eureka:
  instance:
    metadata-map:
      metrics.path: /actuator/prometheus
      health.path: /actuator/health
      management.context-path: /actuator
  client:
    registerWithEureka: false
    fetchRegistry: false

## Application properties
app:
  webExternalBaseUrl: http://localhost:8085
  validUserPhotoFileExtensions: png, jpg, jpeg, gif
  resetPassword:
    validityMinutes: 15
    url: /reset-password/?token=%s
  changePassword:
    validityMinutes: 15
  changeEmail:
    validityMinutes: 30
    revocationValidityMinutes: 7200
    revocationUrl: /revoke-change-email/?token=%s
  forceSetPassword:
    validityMinutes: 15
  security:
    writeTokenInCookie: true
    refreshTokenCookiePath: /eca-oauth/oauth2/token
    tokenInCookieClientIds:
      - eca_web
    whitelistUrls:
      - /reset-password/**
      - /force-set-password/**

mail:
  client:
    async: true
    threadPoolSize: 3
    encrypt:
      enabled: true
      password: pa66word!
      salt: s@lt#

## Password generator configs
password:
  length: 12

tfa:
  codeValiditySeconds: 120
  codeLength: 6
  enabled: true

table:
  data:
    clean:
      enabled: true
      tables:
        - tableName: tfa_code
          creationTimestampColumnName: created
          storagePeriodInDays: 1
        - tableName: reset_password_request
          creationTimestampColumnName: created
          storagePeriodInDays: 30
        - tableName: change_password_request
          creationTimestampColumnName: created
          storagePeriodInDays: 30
        - tableName: change_email_request
          creationTimestampColumnName: created
          storagePeriodInDays: 30
        - tableName: oauth2_authorization
          creationTimestampColumnName: access_token_issued_at
          storagePeriodInDays: 30

## Swagger properties
open-api:
  basePath: /
  title: Microservice for users management
  description: API provides operations with users for ECA web application
  author: Roman Batygin
  email: roman.batygin@mail.ru
  projectVersion: @project.version@
  tokenBaseUrl: http://localhost:8080
  apiAuth:
    PASSWORD:
      scopes: web
    CLIENT_CREDENTIALS:
      scopes: internal-api

springdoc:
  packages-to-exclude: org.springframework.security.oauth2.provider.endpoint
  swagger-ui:
    oauth:
      client-id: swagger
      client-secret: swagger_secret
    disable-swagger-default-url: true

management:
  observations:
    annotations:
      ## Enables span annotations processing
      enabled: true
  tracing:
    sampling:
      probability: 0
  metrics:
    tags:
      application: ${spring.application.name}
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
  info:
    git:
      enabled: true
      mode: full

server:
  forward-headers-strategy: framework
