## Data source properties
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:test_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

## Liquibase properties
spring.liquibase.contexts=schema,data
spring.liquibase.change-log=classpath:db/liquibase-changelog.xml

app.encrypt.password=pa66word!
app.encrypt.salt=#s@lt

web-push.notificationLifeTimeDays=7
web-push.pushTokenValidityMinutes=240
web-push.rabbit.enabled=false

mail.maxFailedAttemptsToSent=10
mail.pageSize=10
mail.sender=sender@mail.ru
mail.delaySeconds=3

queues.pushQueue=/push

lock.enabled=true

user-notification.emailEnabled=true
user-notification.webPushEnabled=true
user-notification.notificationEventOptions[0].event-type=EXPERIMENT_STATUS_CHANGE
user-notification.notificationEventOptions[0].emailEnabled=true
user-notification.notificationEventOptions[0].webPushEnabled=true
user-notification.notificationEventOptions[0].emailSupported=true
user-notification.notificationEventOptions[0].webPushSupported=true
user-notification.notificationEventOptions[1].event-type=CLASSIFIER_STATUS_CHANGE
user-notification.notificationEventOptions[1].emailEnabled=false
user-notification.notificationEventOptions[1].webPushEnabled=true
user-notification.notificationEventOptions[1].emailSupported=false
user-notification.notificationEventOptions[1].webPushSupported=true
