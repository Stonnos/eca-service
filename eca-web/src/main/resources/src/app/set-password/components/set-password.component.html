<div class="container">
  <div class="row h-100">
    <div class="col-12 d-flex py-4">
      <form novalidate class="form d-flex flex-column justify-content-center m-auto"
            (submit)="submit()"
            (keydown.enter)="submit()">
        <p-panel header="Установка нового пароля">
          <div *ngIf="tokenValid" class="ui-g ui-fluid">
            <div class="ui-g-10 mx-auto">
              <label class="text-bold">Новый пароль</label>
              <input
                required
                notBlank
                pPassword
                validateEqual="confirmPassword"
                source="true"
                id="password"
                name="password"
                type="password"
                [feedback]="false"
                placeholder="Введите пароль"
                [(ngModel)]="password"
                [disabled]="loading"
                [pattern]="passwordRegex"
                [pTooltip]="passwordTooltipText"
                maxlength="255"
                class="form-control d-block w-100">
              <p-panel class="password-validation-rule-details"
                       [header]="'Безопасный пароль должен содержать:'"
                       *ngIf="submitted && notSafePassword">
                <div class="row text-left text-bold text-wrap font-12 mb-2 ml-2"
                     *ngFor="let rule of passwordValidationRuleDetails">
                  <span *ngIf="rule.valid" class="pi pi-check text-green">
                    {{ rule.message }}
                  </span>
                  <span *ngIf="!rule.valid" class="pi pi-times text-red">
                    {{ rule.message }}
                  </span>
                </div>
              </p-panel>
              <div class="text-danger error-message" *ngIf="submitted && notSafePassword">
                Пароль не соответствует требованиям безопасности
              </div>
            </div>
            <div class="ui-g-10 mx-auto mt-3">
              <label class="text-bold">Подтверждение пароля</label>
              <input
                required
                notBlank
                pPassword
                validateEqual="password"
                id="confirmPassword"
                name="confirmPassword"
                type="password"
                [feedback]="false"
                placeholder="Пароль еще раз"
                [(ngModel)]="confirmPassword"
                [disabled]="loading"
                [pattern]="passwordRegex"
                [pTooltip]="passwordTooltipText"
                maxlength="255"
                class="form-control d-block w-100">
            </div>
            <div class="ui-g-10 mx-auto">
              <label class="text-bold">Код подтверждения</label>
              <input
                required
                pInputText
                id="confirmationCode"
                name="confirmationCode"
                type="text"
                placeholder="Введите код подтверждения"
                [(ngModel)]="confirmationCode"
                [disabled]="loading"
                maxlength="255"
                class="form-control d-block w-100">
            </div>
            <div class="ui-g-10 set-password-request-error mx-auto">
              <div *ngIf="errorCode && submitted" class="text-danger text-center mb-1">
                {{ getErrorMessage() }}
              </div>
            </div>
            <div class="ui-g-10 mx-auto">
              <button
                pButton
                type="button"
                (click)="submit()"
                [disabled]="!isValid() || loading"
                class="set-password-button ml-auto">
                <span class="set-password-text" *ngIf="!loading">Изменить пароль</span>
                <p-progressSpinner
                  *ngIf="loading"
                  class="set-password-progress-spinner"
                  strokeWidth="4"
                  animationDuration=".5s">
                </p-progressSpinner>
              </button>
            </div>
          </div>
          <div *ngIf="!tokenValid" class="ui-g ui-fluid">
            <div class="ui-g-10 mx-auto d-flex align-items-center justify-content-center text-center text-bold">
              Не удалось установить пароль, т.к. истекло время действия.
            </div>
            <div class="ui-g-10 mx-auto mt-3">
              <button
                pButton
                [routerLink]="['/login']"
                type="button"
                label="На страницу входа"
                class="w-100 mb-1 mb-sm-2">
              </button>
            </div>
          </div>
        </p-panel>
      </form>
    </div>
  </div>
</div>
